<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Safar Lee — Trade request</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://use.typekit.net/tnv1bkt.css">
<style>
  :root { --plum: #644678; --deep: #4A3C58; --ink: #1F1428; --gold: #8A6516; --lilac: #F4EEF7; --rule: #E4D8EF; --red: #8A2B35; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #FFFFFF; color: var(--ink); font-family: "sofia-pro", "Sofia Pro", system-ui, -apple-system, sans-serif; line-height: 1.5; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 56px; text-align: center; }
  header { padding-bottom: 24px; border-bottom: 1px solid var(--rule); }
  header img { width: 150px; height: auto; }
  .kicker { margin: 12px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 6px 0 0; font-size: 30px; font-weight: 500; color: var(--plum); }
  .lead { margin: 10px auto 0; max-width: 480px; color: var(--deep); overflow-wrap: anywhere; }
  section { margin-top: 28px; }
  .card { padding: 28px 20px; border-radius: 12px; background: var(--lilac); }
  .actions { display: grid; gap: 12px; max-width: 360px; margin: 0 auto; }
  .btn { display: block; width: 100%; min-height: 50px; padding: 14px 26px; border-radius: 999px; background: #FFFFFF; color: var(--plum); border: 1.5px solid var(--plum); font: inherit; font-weight: 700; cursor: pointer; }
  .btn.block { color: var(--red); border-color: var(--red); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .small { margin: 0 auto 16px; max-width: 460px; font-size: 13px; color: var(--deep); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a href="/"><img src="/wordmark-purple.svg" alt="Safar Lee"></a>
    <p class="kicker">Trade request</p>
    <h1 id="title">Working…</h1>
    <p class="lead" id="lead" role="status"></p>
  </header>

  <section class="card" id="more" hidden>
    <p class="small">Changed your mind?</p>
    <div class="actions"><button class="btn" id="other" type="button"></button></div>
  </section>

</div>
<script>
  // Web-app URL of the B2B Apps Script (kept outside this repo). Must match the one in /trade and /catalogb2b.
  var B2B_ENDPOINT = "https://script.google.com/macros/s/AKfycbyfPtkZIZBJ741iuyKcNCEbNCkkgS9k0hMQa_6xqsHrnzy7mErNx97VEh7-Fl-dub_z1w/exec";

  // The admin email links here as /trade/review#id=…&ak=…&d=approve|block. Everything after "#" stays in the browser.
  var q = new URLSearchParams(location.hash.replace(/^#/, ""));
  var id = q.get("id") || "", ak = q.get("ak") || "", first = q.get("d") || "";
  var $ = function (i) { return document.getElementById(i); };
  try { history.replaceState(null, "", location.pathname); } catch (e) {}   // keep the keys out of the address bar and history

  function show(title, lead, offer) {
    $("title").textContent = title;
    $("lead").textContent = lead;
    $("more").hidden = !offer;
    if (offer) {
      $("other").textContent = offer === "block" ? "Block this buyer instead" : "Approve and email the price link";
      $("other").className = "btn" + (offer === "block" ? " block" : "");
      $("other").disabled = false;
      $("other").onclick = function () { decide(offer); };
    }
  }

  function decide(decision) {
    $("other").disabled = true;
    show(decision === "approve" ? "Approving…" : "Blocking…", "", null);
    fetch(B2B_ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "decide", id: id, ak: ak, decision: decision }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var who = d.email ? d.email + (d.company ? " (" + d.company + ")" : "") : "This buyer";
        if (d.result === "approved") {
          show("Approved", who + " has been emailed a personal price link, valid " + d.days + " days.", "block");
        } else if (d.result === "already_approved") {
          show("Already approved", who + " was approved earlier and already has the link. No new email was sent.", "block");
        } else if (d.result === "approved_no_email") {
          show("Approved, but the email was not sent", who + " is approved, but the link email could not be sent. The daily email limit may be used up. Press the button below later to send it.", "approve");
        } else if (d.result === "blocked") {
          show("Blocked", who + " is blocked. Their price link, if any, no longer works.", "approve");
        } else if (d.result === "invalid") {
          show("Link not valid", "This review link is not valid. Change the status in the B2B Leads sheet instead.", null);
        } else {
          show("Not updated yet", "The approval system did not accept this button. Change the status in the B2B Leads sheet instead.", null);
        }
      })
      .catch(function () {
        show("Could not connect", "Nothing was changed. Check your connection, then open the button in the email again.", null);
      });
  }

  if (!id || !ak || (first !== "approve" && first !== "block")) {
    show("Link not valid", "Open the Approve or Block button in the notification email again.", null);
  } else {
    decide(first);
  }
</script>
</body>
</html>
